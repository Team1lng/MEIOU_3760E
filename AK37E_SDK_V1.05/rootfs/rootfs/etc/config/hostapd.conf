interface=wlan0             #无线网卡接口
ctrl_interface=/tmp/hostapd #控制接口目录
ignore_broadcast_ssid=0     #是否隐藏SSID
wmm_enabled=1               #启用WMM
ht_capab=[SHORT-GI-20]      #HT40+][RX-STBC1] #HT能力
macaddr_acl=0               #MAC地址过滤关闭
auth_algs=1                 #认证算法
wpa_pairwise=TKIP CCMP      #WPA（兼容）使用的加密套件：TKIP 和 CCMP
rsn_pairwise=CCMP           #RSN使用的加密套件：CCMP
ssid=AK_IPC                 #无线网络名称
wpa_passphrase=11111111     #无线网络密码
channel=1                   #无线信道
hw_mode=g                   #无线模式：g模式
ieee80211n=1                #启用802.11n
wpa=2                       #启用WPA2
wpa_key_mgmt=WPA-PSK        #使用预共享密钥的WPA
